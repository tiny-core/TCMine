# Publica a imagem do TCMine Server no Docker Hub a partir de uma tag do git.
#
# Dispara em tags "server-v*" — o prefixo separa os dois produtos do repositório,
# para que uma release do launcher não construa o servidor e vice-versa.
#
# Antes do primeiro uso, defina em Settings > Secrets and variables > Actions:
#   DOCKERHUB_USERNAME  seu usuário do Docker Hub
#   DOCKERHUB_TOKEN     um access token (Docker Hub > Account Settings > Security)
#                       com permissão de escrita — não a senha da conta
#   DOCKERHUB_IMAGE     (variável, não segredo) nome do repositório da imagem,
#                       ex.: jocian/tcmine-server

name: Publicar imagem do servidor

on:
  push:
    tags:
      - "server-v*"

  # Permite disparar à mão para testar o workflow sem criar tag. Nesse caso a
  # imagem sai marcada como 0.0.0-manual e NÃO recebe a tag "latest".
  workflow_dispatch:

# Só uma publicação por vez: duas tags empurradas juntas competiriam pela tag
# "latest" e a última a terminar venceria, que não é necessariamente a maior.
concurrency:
  group: release-server
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    # write é para criar a release; sem isto o GITHUB_TOKEN só lê.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Descobrir a versão e as tags da imagem
        id: versao
        env:
          IMAGEM: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail

          if [ -z "${IMAGEM}" ]; then
            echo "Defina a variável DOCKERHUB_IMAGE (ex.: jocian/tcmine-server)." >&2
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            versao="${GITHUB_REF_NAME#server-v}"   # server-v1.2.3 -> 1.2.3
          else
            versao="0.0.0-manual"
          fi

          tags="${IMAGEM}:${versao}"

          # "latest" e a tag curta de minor só para release estável. Um
          # pré-lançamento (1.2.3-beta.1) virando latest entregaria beta a quem
          # só pediu "a versão atual".
          case "${versao}" in
            *-*|0.0.0-manual)
              echo "Pré-lançamento ou execução manual: sem latest." ;;
            *)
              minor="${versao%.*}"
              tags="${tags},${IMAGEM}:${minor},${IMAGEM}:latest" ;;
          esac

          {
            echo "versao=${versao}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

          echo "Versão ${versao}"
          echo "Tags: ${tags}"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Os testes rodam ANTES de publicar, e não num workflow à parte que talvez
      # tenha passado numa versão anterior do código: uma imagem publicada é
      # imutável na prática, porque alguém já pode tê-la baixado.
      - name: Testes
        run: |
          set -euo pipefail

          # Um executável por suíte: o SDK do .NET 10 removeu o caminho VSTest e
          # o runner do xUnit v3 é o próprio .exe do projeto. É o mesmo que o
          # scripts/tc test faz.
          for projeto in tests/*/; do
            [ -f "${projeto}"*.csproj ] || continue
            dotnet run --project "$projeto" -c Release
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Constrói para o daemon local ANTES de publicar. Uma imagem publicada é
      # imutável na prática — alguém pode tê-la baixado no minuto seguinte —, e
      # os testes não cobrem o que só quebra na imagem: já saiu release com o
      # runtime do Blazor respondendo 404, sem nada ficar vermelho.
      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tcmine-server:candidata
          build-args: |
            VERSION=${{ steps.versao.outputs.versao }}
          cache-from: type=gha,scope=imagem-servidor
          cache-to: type=gha,mode=max,scope=imagem-servidor

      - name: Fumaça da imagem
        # Chamado por "bash" e não por ./: o bit de execução é atributo de
        # filesystem e nem todo checkout o preserva — foi assim que uma release
        # morreu com "Permission denied". O bit está no índice do git também;
        # isto apenas deixa de depender dele.
        run: bash ./scripts/smoke-image.sh tcmine-server:candidata

      # Reaproveita as camadas do passo anterior: publica exatamente o que
      # acabou de passar na fumaça, sem reconstruir.
      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.versao.outputs.versao }}
          tags: ${{ steps.versao.outputs.tags }}
          cache-from: type=gha,scope=imagem-servidor

      # Depois de publicar, e não antes: uma release anunciando uma imagem que
      # a build não chegou a produzir manda todo mundo a um `docker pull` que
      # falha.
      - name: Publicar a release no GitHub
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          set -euo pipefail

          # Pré-lançamento fica marcado como tal, para o GitHub não apresentá-lo
          # como a versão atual a quem chega pelo "latest release".
          case "${VERSAO}" in
            *-*) marca="--prerelease" ;;
            *)   marca="--latest" ;;
          esac

          # As notas saem dos commits desde a tag anterior. Ficam editáveis
          # depois — o que não pode é a release não existir porque alguém
          # esqueceu de criá-la à mão.
          gh release create "${GITHUB_REF_NAME}"             --title "TCMine Server ${VERSAO}"             --generate-notes             ${marca}
