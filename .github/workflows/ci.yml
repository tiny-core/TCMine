# Verificação de cada push e de cada pull request.
#
# Existe porque, sem ela, um commit quebrado na master só aparecia na hora de
# lançar uma versão — que é o pior momento para descobrir.

name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

# Um PR empurrado três vezes seguidas não precisa das três execuções: só a
# última interessa. Em master não cancela — cada commit precisa do próprio
# veredito, senão fica um intervalo sem ninguém saber se compila.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Cada passo de dotnet gasta segundos com telemetria, banner e o "primeiro uso".
# Multiplicado por restore, build e cinco execuções de teste, vira minuto.
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  testes:
    name: Build e testes
    runs-on: ubuntu-latest

    # PostgreSQL de verdade para os testes que o SQLite não consegue exercer: ele
    # aceita qualquer texto num varchar(n) e ignora o limite declarado, então uma
    # coluna curta demais passava pela suíte inteira e só aparecia ao importar um
    # pack real, em produção. Sem TCMINE_TEST_POSTGRES esses testes se pulam
    # sozinhos, e é por isso que rodar a suíte na própria máquina continua não
    # exigindo banco nenhum.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tcmine
          POSTGRES_PASSWORD: tcmine
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Sem o healthcheck o job começa antes de o banco aceitar conexão, e a
        # falha aparece como erro de teste em vez de erro de infraestrutura.
        options: >-
          --health-cmd "pg_isready -U tcmine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Cache dos pacotes por Directory.Packages.props: com Central Package
      # Management, é esse arquivo que decide o conjunto restaurado, então ele é
      # a chave certa.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # TCMine.Server.slnx, não TCMine.slnx: os TESTES do launcher são trabalho
      # da IDE, no Windows (§8 do CLAUDE.md). O binário dele, esse sim, é
      # compilado aqui — pelo Dockerfile, no job da imagem, que o leva dentro.
      - name: Restaurar
        run: dotnet restore TCMine.Server.slnx

      # ContinuousIntegrationBuild=true é o que liga TreatWarningsAsErrors, como
      # o Directory.Build.props documenta. Sem passar isto, o CI compilaria com
      # a mesma tolerância do loop local e não pegaria nada a mais.
      - name: Build
        run: dotnet build TCMine.Server.slnx --no-restore -c Release -p:ContinuousIntegrationBuild=true

      # Um executável por suíte: o SDK do .NET 10 removeu o caminho VSTest e o
      # runner do xUnit v3 é o próprio .exe do projeto. Mesma coisa que o
      # scripts/tc test faz.
      #
      # TCMine.Launcher.* fica de fora do loop: esses projetos não foram
      # construídos pelo passo Build (TCMine.Server.slnx não os lista), então
      # "--no-build" quebraria neles.
      - name: Testes
        env:
          TCMINE_TEST_POSTGRES: "Host=localhost;Port=5432;Username=tcmine;Password=tcmine;Database=postgres"
        run: |
          set -euo pipefail

          for projeto in tests/*/; do
            [ -f "${projeto}"*.csproj ] || continue
            case "$(basename "$projeto")" in
              TCMine.Launcher.*) continue ;;
            esac
            echo "::group::$(basename "$projeto")"
            dotnet run --project "$projeto" -c Release --no-build
            echo "::endgroup::"
          done

  imagem:
    name: Imagem constrói e sobe
    runs-on: ubuntu-latest

    # Não publica nada: constrói o Dockerfile e SOBE o container resultante. Só
    # construir não bastava — a imagem já subiu com o runtime do Blazor
    # respondendo 404, e a página continuava parecendo saudável porque ela
    # pré-renderiza no servidor mesmo com o script quebrado. Tudo que quebrou em
    # produção até aqui passava no build e no `dotnet run`.
    steps:
      # Histórico e tags para a guarda da versão do launcher, logo abaixo.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Só AVISA: o número pode subir em qualquer commit até a release, e é o
      # release-server.yml que recusa publicar sem ele. Aqui o aviso aparece no
      # PR enquanto ainda é barato lembrar.
      - name: Versão do launcher acompanhou as mudanças dele
        run: bash ./scripts/check-launcher-version.sh --warn

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          # load, e não push: a imagem fica no daemon local para o passo
          # seguinte subir de verdade.
          load: true
          tags: tcmine-server:ci
          build-args: |
            VERSION=0.0.0-ci
          # Escopo nomeado: sem ele, cada workflow que constrói imagem disputa a
          # mesma entrada de cache e um invalida o outro. Um PR lê o cache da
          # master e só reconstrói as camadas que mudaram de fato.
          cache-from: type=gha,scope=imagem-servidor
          cache-to: type=gha,mode=max,scope=imagem-servidor

      - name: Fumaça da imagem
        # Chamado por "bash" e não por ./: o bit de execução é atributo de
        # filesystem e nem todo checkout o preserva — foi assim que uma release
        # morreu com "Permission denied". O bit está no índice do git também;
        # isto apenas deixa de depender dele.
        run: bash ./scripts/smoke-image.sh tcmine-server:ci
