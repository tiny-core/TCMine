# Verificação de cada push e de cada pull request.
#
# Existe porque, sem ela, um commit quebrado na master só aparecia na hora de
# lançar uma versão — que é o pior momento para descobrir.

name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

# Um PR empurrado três vezes seguidas não precisa das três execuções: só a
# última interessa. Em master não cancela — cada commit precisa do próprio
# veredito, senão fica um intervalo sem ninguém saber se compila.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Cache dos pacotes por Directory.Packages.props: com Central Package
      # Management, é esse arquivo que decide o conjunto restaurado, então ele é
      # a chave certa.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar
        run: dotnet restore

      # ContinuousIntegrationBuild=true é o que liga TreatWarningsAsErrors, como
      # o Directory.Build.props documenta. Sem passar isto, o CI compilaria com
      # a mesma tolerância do loop local e não pegaria nada a mais.
      - name: Build
        run: dotnet build --no-restore -c Release -p:ContinuousIntegrationBuild=true

      # Um executável por suíte: o SDK do .NET 10 removeu o caminho VSTest e o
      # runner do xUnit v3 é o próprio .exe do projeto. Mesma coisa que o
      # scripts/tc test faz.
      - name: Testes
        run: |
          set -euo pipefail

          for projeto in tests/*/; do
            [ -f "${projeto}"*.csproj ] || continue
            echo "::group::$(basename "$projeto")"
            dotnet run --project "$projeto" -c Release --no-build
            echo "::endgroup::"
          done

  imagem:
    name: Imagem constrói
    runs-on: ubuntu-latest

    # Não publica nada: só garante que o Dockerfile ainda produz uma imagem. Sem
    # isto, uma quebra ali só apareceria ao lançar uma versão — e já aconteceu
    # de a build morrer por causa do global.json, que passa despercebido porque
    # nada no loop local constrói a imagem.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
